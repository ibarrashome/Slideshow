name: Generate images.json automatically

on:
  push:
    branches:
      - main
    paths:
      - "*.jpg"
      - "*.jpeg"
      - "*.png"
      - "*.gif"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate images.json
        run: |
          echo "[" > images.json
          first=true
          for file in *.jpg *.jpeg *.png *.gif; do
            if [ -f "$file" ]; then
              if [ "$first" = true ]; then
                first=false
              else
                echo "," >> images.json
              fi
              echo "  \"https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/$file\"" >> images.json
            fi
          done
          echo "]" >> images.json

      - name: Commit changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add images.json
          git commit -m "Auto-update images.json" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git

