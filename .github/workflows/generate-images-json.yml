name: Generate images.json for GitHub Pages

on:
  push:
    paths:
      - "*.jpg"
      - "*.jpeg"
      - "*.png"
      - ".github/workflows/generate-images-json.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate images.json
        run: |
          echo "[" > images.json
          first=true
          for file in *.jpg *.jpeg *.png; do
            [ -e "$file" ] || continue
            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> images.json
            fi
            echo "  \"https://ibarrashome.github.io/Slideshow/$file\"" >> images.json
          done
          echo "]" >> images.json

      - name: Commit and push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add images.json
          git commit -m "Auto-update images.json" || echo "No changes to commit"
          git push
